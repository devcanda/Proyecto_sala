<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salsa POS</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!--
    Armazon principal. La logica de ruteo vive en js/app.js: decide que
    "seccion" de nivel superior mostrar (venta / productos / inventario /
    alertas / configuracion) y, dentro de "venta", que sub-modo (retail vs
    hospitalidad), inyectando el HTML de views/*.html dentro de #app-view.

    NAVEGACION (calco de Aronium, 2026-09-08). La pantalla de venta del
    original no tiene barra lateral: es una caja a pantalla completa. Por
    eso aqui la barra lateral se oculta en la seccion Venta (via CSS, con
    body[data-seccion]) y la entrada a Administracion es el boton de tres
    puntos de la esquina inferior derecha, que encaja en la ultima celda
    del panel de acciones. En las secciones de administracion la barra
    lateral si aparece, para saber donde se esta y poder volver.

    Los botones de navegacion estan DUPLICADOS a proposito (barra lateral y
    menu flotante): app.js los enlaza por clase y atributo de datos
    (".seccion-btn[data-seccion]"), no por id, asi que ambas copias
    funcionan. Tienen que vivir aqui, en el HTML estatico, porque init()
    los enlaza una sola vez al arrancar, antes de inyectar ninguna vista.

    Regla de UX critica (documento maestro, seccion 5-B): #barcode-input
    debe mantener el foco SIEMPRE que no haya un dialogo modal abierto,
    para que el lector de codigo de barras (que emula teclado) funcione
    sin que el operario tenga que tocar el mouse.
  -->
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar__brand">Salsa <span>POS</span></div>
      <nav class="sidebar__nav">
        <button data-seccion="venta" class="seccion-btn">
          <svg class="icono" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1.6 2.2h1.9l1.5 7.2a.9.9 0 0 0 .9.7h5.5a.9.9 0 0 0 .9-.7l1-4.2H4.2" />
            <circle cx="6.3" cy="13" r="1" />
            <circle cx="11.6" cy="13" r="1" />
          </svg>
          Venta
        </button>
        <span class="sidebar__titulo">Administración</span>
        <button data-seccion="productos" class="seccion-btn seccion-btn--sub">Productos</button>
        <button data-seccion="inventario" class="seccion-btn seccion-btn--sub">Inventario</button>
        <button data-seccion="alertas" class="seccion-btn seccion-btn--sub">Alertas</button>
        <button data-seccion="configuracion" class="seccion-btn seccion-btn--sub">Configuración</button>
      </nav>
    </aside>

    <div class="shell__contenido">
      <main id="app-view" class="app-view">
        <!-- Contenido inyectado dinamicamente por app.js -->
      </main>
    </div>
  </div>

  <!--
    Boton de los tres puntos. Encaja en la ultima celda del panel de
    acciones de Retail (ver .btn-placeholder--menu en pos_retail.html):
    esta fijo respecto a la ventana y toma sus medidas de las mismas
    variables CSS que la reticula de ese panel, para que no se desalineen.
    Vive aqui y no en la vista porque app.js lo enlaza al arrancar.
  -->
  <button
    type="button"
    id="btn-admin-toggle"
    class="btn-menu-flotante"
    aria-expanded="false"
    aria-controls="admin-submenu"
    aria-label="Menú de navegación"
    title="Menú"
  >
    <span class="btn-menu-flotante__puntos" aria-hidden="true">
      <span></span><span></span><span></span>
    </span>
  </button>

  <nav id="admin-submenu" class="menu-flotante" hidden>
    <!-- #venta-subnav: app.js lo oculta con [hidden] cuando la seccion no
         es Venta, asi que el grupo de modos solo aparece donde aplica. -->
    <div id="venta-subnav" class="menu-flotante__grupo">
      <span class="menu-flotante__titulo">Modo de venta</span>
      <button data-modo="retail" class="modo-btn">Retail</button>
      <button data-modo="hospitalidad" class="modo-btn">Hospitalidad</button>
    </div>

    <span class="menu-flotante__titulo">Administración</span>
    <button data-seccion="productos" class="seccion-btn">Productos</button>
    <button data-seccion="inventario" class="seccion-btn">Inventario</button>
    <button data-seccion="alertas" class="seccion-btn">Alertas</button>
    <button data-seccion="configuracion" class="seccion-btn">Configuración</button>

    <span class="menu-flotante__sep" aria-hidden="true"></span>
    <button data-seccion="venta" class="seccion-btn">Venta</button>
  </nav>

  <!--
    Barra de estado inferior. Solo el indicador de conexion.

    Aqui vivia tambien el campo del lector de codigo de barras
    (#barcode-input). Se quito el 2026-09-08 por redundante: el lector
    escribe ahora en el mismo buscador de cada pantalla, que es el que
    lleva el atributo [data-captura-barras] (ver frontend/js/barcode.js).
  -->
  <footer class="statusbar">
    <span class="topbar__status" id="connection-status">● conectando...</span>
  </footer>

  <!--
    Dialogo de cantidad con teclado numerico en pantalla (calco del
    2026-09-08). Se abre al elegir un producto en el buscador y sirve tanto
    a dedo/raton como con el teclado fisico: el campo es un <input> de
    verdad y esta enfocado, asi que tecleando se escribe directo.

    Vive aqui, en el HTML estatico, y no en una vista: es un dialogo global
    y app.js lo enlaza una sola vez al arrancar.

    OJO: mientras esta abierto, app.js llama a barcodeFocus.pausar(). Sin
    eso, barcode.js le devolveria el foco al buscador cada 1,5s y lo que se
    teclease en el dialogo acabaria en la barra de busqueda.
  -->
  <div
    id="dialogo-cantidad"
    class="dialogo-cantidad"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialogo-cantidad-titulo"
    hidden
  >
    <div class="dialogo-cantidad__panel">
      <h2 id="dialogo-cantidad-titulo" class="dialogo-cantidad__titulo">Cambiar cantidad</h2>
      <p class="dialogo-cantidad__texto">
        Producto <span id="dialogo-cantidad-producto"></span>
      </p>
      <p class="dialogo-cantidad__texto">
        Cantidad predeterminada: <span id="dialogo-cantidad-defecto">1</span>
      </p>

      <input
        type="text"
        id="dialogo-cantidad-input"
        class="dialogo-cantidad__campo"
        inputmode="decimal"
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        aria-label="Cantidad"
      />
      <p id="dialogo-cantidad-error" class="dialogo-cantidad__error" hidden></p>

      <!-- data-tecla: lo lee pulsarTeclaCantidad() en app.js, que es la
           misma funcion que atiende al teclado fisico. -->
      <div class="teclado-numerico">
        <button type="button" class="tecla" data-tecla="1">1</button>
        <button type="button" class="tecla" data-tecla="2">2</button>
        <button type="button" class="tecla" data-tecla="3">3</button>
        <button type="button" class="tecla tecla--secundaria" data-tecla="borrar" aria-label="Borrar">
          <svg class="tecla__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 5h10a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 19 19H9L2.6 12z" />
            <path d="M12.4 9.6l5 4.8M17.4 9.6l-5 4.8" />
          </svg>
        </button>

        <button type="button" class="tecla" data-tecla="4">4</button>
        <button type="button" class="tecla" data-tecla="5">5</button>
        <button type="button" class="tecla" data-tecla="6">6</button>
        <button type="button" class="tecla tecla--secundaria" data-tecla="esc">esc</button>

        <button type="button" class="tecla" data-tecla="7">7</button>
        <button type="button" class="tecla" data-tecla="8">8</button>
        <button type="button" class="tecla" data-tecla="9">9</button>
        <button type="button" class="tecla tecla--enter" data-tecla="enter" aria-label="Aceptar">
          <svg class="tecla__icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 5.5v7a2.5 2.5 0 0 1-2.5 2.5H5" />
            <path d="M9 11l-4 4 4 4" />
          </svg>
        </button>

        <!-- El signo menos existe en el original. Aqui se puede teclear,
             pero confirmarCantidad() rechaza cualquier cantidad que no sea
             mayor que cero: una cantidad negativa descontaria inventario al
             reves y no se notaria hasta cuadrar la caja. -->
        <button type="button" class="tecla" data-tecla="-">-</button>
        <button type="button" class="tecla" data-tecla="0">0</button>
        <button type="button" class="tecla" data-tecla=".">.</button>
      </div>
    </div>
  </div>

  <!-- Notificaciones no bloqueantes (ej. "Producto guardado correctamente").
       Ver mostrarToast() en app.js. -->
  <div id="toast" class="toast" hidden></div>

  <script src="js/api.js"></script>
  <script src="js/barcode.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
