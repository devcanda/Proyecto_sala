<!--
  views/pos_hospitalidad.html
  ------------------------------
  Fragmento inyectado en #app-view cuando el modo activo es "hospitalidad".
  Flujo: el mesero primero elige una mesa (mapa del local); al seleccionar
  una mesa libre se abre una cuenta nueva, y al seleccionar una ocupada se
  retoma la cuenta abierta existente (ver GET /pos/mesas/{id}/orden-abierta).
-->
<section class="pos-hospitalidad">
  <div class="pos-hospitalidad__mesas" id="vista-mesas">
    <h2>Mesas</h2>
    <div id="mesas-grid" class="mesas-grid"></div>

    <form id="form-nueva-mesa" class="form-inline" style="margin-top: 1rem;" hidden>
      <div class="campo">
        <label for="nueva-mesa-nombre">Nombre</label>
        <input type="text" id="nueva-mesa-nombre" placeholder="ej. Mesa 5" required />
      </div>
      <div class="campo">
        <label for="nueva-mesa-capacidad">Capacidad</label>
        <input type="number" id="nueva-mesa-capacidad" min="1" />
      </div>
      <button type="submit" class="btn-primario">Crear mesa</button>
      <button type="button" id="btn-cancelar-nueva-mesa" class="btn-secundario">Cancelar</button>
    </form>
  </div>

  <div class="pos-hospitalidad__cuenta" id="vista-cuenta" hidden>
    <button id="btn-volver-mesas" class="btn-secundario">&larr; Volver a mesas</button>
    <h2 id="cuenta-titulo">Mesa</h2>

    <div class="pos-retail__grid">
      <div id="productos-grid" class="grid-productos"></div>
    </div>

    <aside class="ticket-panel" id="ticket-panel">
      <h2>Cuenta</h2>
      <p class="hint">
        Escanea un codigo de barras, o escribe <code>5*codigo</code> para
        agregar 5 unidades de una vez.
      </p>
      <div class="tabla-ticket-scroll">
        <table class="tabla-ticket">
          <thead>
            <tr>
              <th>Nombre del producto</th>
              <th>Cantidad</th>
              <th>Precio</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="ticket-lineas"></tbody>
        </table>
      </div>
      <p id="ticket-vacio" class="hint">No hay artículos. Escanea un código de barras o haz clic en un producto.</p>
      <div class="ticket-total">
        Total: <strong id="ticket-total">$0.00</strong>
      </div>
      <button id="btn-cobrar" class="btn-primario" disabled>Cobrar</button>
    </aside>
  </div>
</section>
