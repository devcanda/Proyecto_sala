<!--
  views/pos_retail.html
  -----------------------
  Fragmento (no es un documento HTML completo) inyectado dentro de
  #app-view por app.js cuando el modo activo es "retail". Pensado para
  venta ultra rapida de mostrador: grilla de productos + ticket a la vista,
  sin pasos intermedios de "mesa" o "comanda".
-->
<section class="pos-retail">
  <div class="pos-retail__grid">
    <h2>Productos</h2>
    <div id="productos-grid" class="grid-productos"></div>
  </div>

  <aside class="ticket-panel" id="ticket-panel">
    <h2>Ticket actual</h2>
    <p class="hint">
      Escanea un codigo de barras, o escribe <code>5*codigo</code> para
      agregar 5 unidades de una vez.
    </p>
    <ul id="ticket-lineas" class="ticket-lineas"></ul>
    <div class="ticket-total">
      Total: <strong id="ticket-total">$0.00</strong>
    </div>
    <button id="btn-cobrar" class="btn-primario" disabled>Cobrar</button>
  </aside>
</section>
